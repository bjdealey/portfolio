<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV — Brad Dealey</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --accent: #F5A623;
      --black:  #080808;
      --body:   #1a1a1a;
      --muted:  #555;
      --rule:   #e0e0e0;
      --mono:   'Courier New', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0ede8;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--body);
    }

    /* ── SCREEN: toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--black);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .toolbar-label {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: rgba(255,255,255,.4);
    }
    .toolbar-actions { display: flex; gap: 12px; }
    .btn-save {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: var(--accent);
      color: #000;
      font-family: var(--mono);
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-save:hover { background: #ffc042; }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1.5px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.6);
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      border-radius: 2px;
      text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .btn-back:hover { border-color: rgba(255,255,255,.4); color: #fff; }

    /* ── DOCUMENT ── */
    .page-wrap {
      padding: 40px 24px 80px;
      display: flex;
      justify-content: center;
    }
    .cv {
      background: #fff;
      width: 100%;
      max-width: 800px;
      padding: 56px 64px;
      box-shadow: 0 4px 40px rgba(0,0,0,.12);
    }

    /* ── HEADER ── */
    .cv-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 3px solid var(--black);
      margin-bottom: 32px;
    }
    .cv-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    .cv-name span { color: var(--accent); }
    .cv-role {
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }
    .cv-contact {
      text-align: right;
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.9;
      flex-shrink: 0;
    }
    .cv-contact a { color: var(--body); text-decoration: underline; text-underline-offset: 2px; }

    /* ── SECTIONS ── */
    .cv-section { margin-bottom: 32px; }
    .cv-section:last-child { margin-bottom: 0; }

    .cv-section-title {
      font-family: var(--mono);
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 6px;
      margin-bottom: 18px;
    }

    /* ── EXPERIENCE ── */
    .cv-entry { margin-bottom: 22px; }
    .cv-entry:last-child { margin-bottom: 0; }
    .cv-entry-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .cv-entry-role { font-weight: 700; font-size: .98rem; }
    .cv-entry-period {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .08em;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cv-entry-company {
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 3px 0 8px;
    }
    .cv-entry-desc { font-size: .88rem; color: #333; line-height: 1.65; }

    /* ── SKILLS ── */
    .cv-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .cv-tag {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .06em;
      padding: 4px 10px;
      border: 1px solid var(--rule);
      color: var(--body);
    }

    /* ── PROJECTS ── */
    .cv-project { margin-bottom: 14px; }
    .cv-project:last-child { margin-bottom: 0; }
    .cv-project-head { display: flex; align-items: baseline; gap: 10px; }
    .cv-project-title { font-weight: 700; font-size: .93rem; }
    .cv-project-tags {
      font-family: var(--mono);
      font-size: .6rem;
      color: var(--muted);
      letter-spacing: .06em;
    }
    .cv-project-desc { font-size: .85rem; color: #333; margin-top: 3px; line-height: 1.6; }
    .cv-project-link { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .cv-project-link a { color: var(--body); }

    /* ── CERTS ── */
    .cv-cert { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
    .cv-cert:last-child { margin-bottom: 0; }
    .cv-cert-title { font-size: .88rem; font-weight: 600; }
    .cv-cert-meta {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; font-size: 11pt; }
      .toolbar { display: none; }
      .page-wrap { padding: 0; }
      .cv {
        max-width: none;
        width: 100%;
        padding: 0;
        box-shadow: none;
      }
      .cv-name { font-size: 22pt; }
      a { color: inherit !important; text-decoration: none !important; }

      .cv-entry,
      .cv-project { break-inside: avoid; }
      .cv-section  { break-inside: avoid; }
    }

    @page {
      size: A4;
      margin: 18mm 18mm 18mm 18mm;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-label">CV Preview</span>
    <div class="toolbar-actions">
      <a href="index.html" class="btn-back">
        ← Portfolio
      </a>
      <button class="btn-save" onclick="window.print()">
        <svg viewBox="0 0 18 18" fill="none" width="14" height="14">
          <path d="M9 2v9M5 7l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Save as PDF
      </button>
    </div>
  </div>

  <div class="page-wrap">
    <div class="cv" id="cv-doc">
      <!-- rendered by script below -->
    </div>
  </div>

  <script src="content.js"></script>
  <script>
    const C   = CONTENT;
    const doc = document.getElementById('cv-doc');

    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const sections = [];

    // Header
    const locationNote = 'Leicester, UK';
    sections.push(`
      <header class="cv-header">
        <div>
          <div class="cv-name">${esc(C.name.split(' ')[0])} <span>${esc(C.name.split(' ').slice(1).join(' '))}</span></div>
          <div class="cv-role">${esc(C.hero.titleLine1)} ${esc(C.hero.titleAccent)}</div>
        </div>
        <div class="cv-contact">
          <div><a href="mailto:${esc(C.email)}">${esc(C.email)}</a></div>
          <div><a href="${esc(C.github)}" target="_blank">${esc(C.github.replace('https://',''))}</a></div>
          ${C.linkedin ? `<div><a href="${esc(C.linkedin)}" target="_blank">linkedin.com/in/brad-dealey</a></div>` : ''}
          <div>${locationNote}</div>
        </div>
      </header>
    `);

    // Profile
    sections.push(`
      <section class="cv-section">
        <div class="cv-section-title">Profile</div>
        ${C.about.body.map(p => `<p style="margin-bottom:8px;font-size:.9rem;color:#333;line-height:1.7">${esc(p)}</p>`).join('')}
      </section>
    `);

    // Experience
    if (C.timeline && C.timeline.length) {
      sections.push(`
        <section class="cv-section">
          <div class="cv-section-title">Experience</div>
          ${C.timeline.map(e => `
            <div class="cv-entry">
              <div class="cv-entry-head">
                <div class="cv-entry-role">${esc(e.role)}</div>
                <div class="cv-entry-period">${esc(e.period)}</div>
              </div>
              <div class="cv-entry-company">${esc(e.company)}</div>
              <div class="cv-entry-desc">${esc(e.description)}</div>
            </div>
          `).join('')}
        </section>
      `);
    }

    // Skills
    sections.push(`
      <section class="cv-section">
        <div class="cv-section-title">Skills &amp; Technologies</div>
        <div class="cv-tags">
          ${C.about.tags.map(t => `<span class="cv-tag">${esc(t)}</span>`).join('')}
        </div>
      </section>
    `);

    // Projects
    const techProjects = C.projects.filter(p => p.linkHref.startsWith('http'));
    if (techProjects.length) {
      sections.push(`
        <section class="cv-section">
          <div class="cv-section-title">Projects</div>
          ${techProjects.map(p => `
            <div class="cv-project">
              <div class="cv-project-head">
                <div class="cv-project-title">${esc(p.title)}</div>
                <div class="cv-project-tags">${p.tags.join(' · ')}</div>
              </div>
              <div class="cv-project-desc">${esc(p.description)}</div>
              <div class="cv-project-link"><a href="${esc(p.linkHref)}" target="_blank">${esc(p.linkHref)}</a></div>
            </div>
          `).join('')}
        </section>
      `);
    }

    // Certifications
    if (C.certifications && C.certifications.length) {
      sections.push(`
        <section class="cv-section">
          <div class="cv-section-title">Certifications</div>
          ${C.certifications.map(c => `
            <div class="cv-cert">
              <div class="cv-cert-title">${esc(c.title)}</div>
              <div class="cv-cert-meta">${esc(c.issuer)}<br>${esc(c.issued)}</div>
            </div>
          `).join('')}
        </section>
      `);
    }

    doc.innerHTML = sections.join('');
    document.title = `CV — ${C.name}`;
  </script>

</body>
</html>
