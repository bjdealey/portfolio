name: Update availability

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cal.com availability
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          END=$(date -u -d "+14 days" +"%Y-%m-%dT%H:%M:%SZ")

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $CAL_API_KEY" \
            -H "cal-api-version: 2024-06-14" \
            "https://api.cal.com/v2/slots/available?eventTypeId=5955127&startTime=${NOW}&endTime=${END}")

          python3 - "$RESPONSE" <<'EOF'
          import json, sys
          from datetime import datetime, timedelta, timezone

          try:
              data  = json.loads(sys.argv[1])
              slots = data.get('data', {}).get('slots', {})
          except Exception as err:
              print(f'Parse error: {err}')
              sys.exit(0)

          now       = datetime.now(timezone.utc)
          available = sorted(d for d, s in slots.items() if s)
          print(f'Available days in next 14: {len(available)}')

          if not available:
              result = {'status': 'unavailable', 'text': 'Fully booked — check back soon'}
          else:
              week_end = now + timedelta(days=7)
              first    = datetime.fromisoformat(available[0]).replace(tzinfo=timezone.utc)
              if first <= week_end:
                  result = {'status': 'available', 'text': 'Available this week'}
              else:
                  label  = first.strftime('%-d %b')
                  result = {'status': 'soon', 'text': f'Available from {first.strftime("%a")} {label}'}

          with open('availability.json', 'w') as f:
              json.dump(result, f)
          print(f'Written: {result}')
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add availability.json
          git diff --cached --quiet || git commit -m "Update availability status" && git push
