name: Update availability

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cal.com availability
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          from datetime import datetime, timedelta, timezone

          api_key = os.environ.get('CAL_API_KEY', '')
          if not api_key:
              print('No API key — skipping')
              sys.exit(0)

          EVENT_TYPE_ID = 5955127  # bradjd/30min

          headers = {
              'Authorization': f'Bearer {api_key}',
              'cal-api-version': '2024-06-14',
          }

          now = datetime.now(timezone.utc)
          end = now + timedelta(days=14)
          url = (
              f'https://api.cal.com/v2/slots/available'
              f'?eventTypeId={EVENT_TYPE_ID}'
              f'&startTime={now.strftime("%Y-%m-%dT%H:%M:%SZ")}'
              f'&endTime={end.strftime("%Y-%m-%dT%H:%M:%SZ")}'
          )

          try:
              req  = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  data = json.loads(r.read())
              slots = data.get('data', {}).get('slots', {})
          except Exception as err:
              print(f'Could not fetch slots: {err}')
              sys.exit(0)

          available = sorted(d for d, s in slots.items() if s)
          print(f'Available days in next 14: {len(available)}')

          if not available:
              result = {'status': 'unavailable', 'text': 'Fully booked — check back soon'}
          else:
              week_end = now + timedelta(days=7)
              first    = datetime.fromisoformat(available[0]).replace(tzinfo=timezone.utc)
              if first <= week_end:
                  result = {'status': 'available', 'text': 'Available this week'}
              else:
                  label  = first.strftime('%-d %b')
                  result = {'status': 'soon', 'text': f'Available from {first.strftime("%a")} {label}'}

          with open('availability.json', 'w') as f:
              json.dump(result, f)
          print(f'Written: {result}')
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add availability.json
          git diff --cached --quiet || git commit -m "Update availability status" && git push
